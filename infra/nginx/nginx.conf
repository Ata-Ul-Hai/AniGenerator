server {
    listen 80;
    server_name yourdomain.com;

    # Backend-served web console
    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend API
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50M;
    }

    # Serve backend-generated artifacts (includes rendered MP4 runs)
    location /artifacts/ {
        alias /app/renderer/public/;
        add_header Cache-Control "public, max-age=300";
    }
}
