steps:
  # Step 1: Build the container image using the root Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', 'gcr.io/$PROJECT_ID/anigenerator-git:$COMMIT_SHA', 
      '.', 
      '-f', 'Dockerfile'
    ]

  # Step 2: Push the image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/anigenerator-git:$COMMIT_SHA']

  # Step 3: Deploy the image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'anigenerator-git',
      '--image', 'gcr.io/$PROJECT_ID/anigenerator-git:$COMMIT_SHA',
      '--region', 'europe-west1',
      '--platform', 'managed',
      '--allow-unauthenticated'
    ]

# This is the "Magic Fix" that clears the logging bucket error!
options:
  logging: CLOUD_LOGGING_ONLY
